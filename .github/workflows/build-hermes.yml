name: Build Hermes for Raspberry Pi ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Download official Hermes source
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git

      - name: Fix icon tool module type
        working-directory: hermes-agent
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("apps/desktop/scripts/run-electron-builder.mjs")
          text = p.read_text()

          old = "    fs.cpSync(directory, destination, { recursive: true, verbatimSymlinks: true })"
          addition = (
              "\n    if (name === 'icons') "
              "fs.writeFileSync(path.join(destination, 'package.json'), "
              "'{\"type\":\"commonjs\"}')"
          )

          if text.count(old) != 1:
              raise SystemExit(
                  "Could not find the expected patch location; "
                  "Hermes source may have changed."
              )

          p.write_text(text.replace(old, old + addition, 1))
          PY

          git config user.name "Hermes Pi build"
          git config user.email "hermes-pi-build@users.noreply.github.com"
          git add apps/desktop/scripts/run-electron-builder.mjs
          git commit -m "Fix Linux icon tool module type"

      - name: Build the ARM64 app
        working-directory: hermes-agent
        run: |
          uname -m
          bash scripts/build-bundle.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: hermes-linux-arm64
          path: hermes-agent/apps/desktop/release/*.AppImage
          if-no-files-found: error
